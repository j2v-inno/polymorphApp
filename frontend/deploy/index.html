<!doctype html>
<!--
  Hand-authored standalone bootstrap HTML for deployed (non-dev-server) hosting
  under a subpath (see README.md "Deployment"). Not generated by
  standalone-single-spa-webpack-plugin: that plugin only alters HTML via
  html-webpack-plugin's dev-server-time compilation hook (confirmed empirically
  — a plain `webpack --mode=production --env standalone` build emits no
  index.html at all) and, even when it does run under `webpack serve`, hardcodes
  its script src as `"/" + <bundle filename>` — an absolute path from the
  domain root that breaks the moment this app is hosted under a subpath instead
  of at "/". This file replicates the same single-spa bootstrap (registerApplication
  + start(), see standalone-single-spa-webpack-plugin's applicationRuntime())
  with the bundle path hardcoded to match wherever it's actually deployed.

  BASE_PATH_PLACEHOLDER is replaced by the Dockerfile's build step (sed) with
  the real deployed subpath (e.g. /ext/app/wa) — do not hand-edit a "resolved"
  copy of this file; edit this template and let the build substitute it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Transapp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="app"></div>
    <script type="importmap">
      {
        "imports": {
          "single-spa": "https://cdn.jsdelivr.net/npm/single-spa/lib/esm/single-spa.dev.js",
          "transapp": "BASE_PATH_PLACEHOLDER/innodata-transapp.js"
        }
      }
    </script>
    <script type="module">
      import('single-spa').then(function (singleSpa) {
        singleSpa.registerApplication({
          name: 'transapp',
          app: function () {
            return import('transapp');
          },
          activeWhen: ['/'],
          customProps: {},
        });
        singleSpa.start({ urlRerouteOnly: true });
      });
    </script>
  </body>
</html>
