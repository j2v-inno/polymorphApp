# transapp routing for rnd-orion.innodata.com — NOT auto-applied
# by anything (manual-deploy.sh/deploy.yml only touch docker-compose.deploy.yml
# and the containers). The box's nginx is one hand-maintained file, no
# conf.d/*.conf include convention exists there today, so this can't be a
# drop-in — splice these two `location` blocks (plus the matching `location =`
# redirects) into the EXISTING `server { listen 443 ssl http2; ... }` block for
# this domain, alongside its `/app/` and `/staging` blocks, then
# `nginx -t && systemctl reload nginx`.
#
# Frontend and backend deliberately use different proxy_pass conventions —
# not a copy-paste inconsistency:
#   - Frontend (no trailing slash on proxy_pass, matching /app's and
#     /staging's own convention exactly): nginx forwards the FULL path
#     unchanged (e.g. /ext/app/wa/innodata-transapp.js stays that way). The
#     frontend's Docker image (see frontend/Dockerfile) nests its built output
#     under that exact same path inside the container for this reason — no
#     custom nginx config needed *inside* the container, plain nginx:alpine
#     defaults just work.
#   - Backend (trailing slash on proxy_pass — `http://localhost:4100/`):
#     nginx STRIPS /ext/app/api before forwarding, since the Express app's own
#     routes are hardcoded as /api/... (register-and-upload, qualification,
#     etc.) and have no reason to know about an external prefix the way an
#     HTML/JS-serving app does. Stripping means zero backend code changes.
#
# Ports (9100 frontend, 4100 backend) match docker-compose.deploy.yml's
# defaults — update both places together if these ever change.

location = /ext/app/wa {
    return 301 /ext/app/wa/;
}

location /ext/app/wa/ {
    proxy_pass http://localhost:9100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ext/app/wa;
    proxy_cache_bypass $http_upgrade;
}

location = /ext/app/api {
    return 301 /ext/app/api/;
}

location /ext/app/api/ {
    proxy_pass http://localhost:4100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ext/app/api;
    # Acquisition uploads a whole PDF in one request (e.g. a ~13MB book in the
    # real test case) — the server block's existing `client_max_body_size 50M;`
    # already covers this; no per-location override needed.
}
